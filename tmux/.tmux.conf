##### CORE #####
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

##### TERMINAL #####
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

##### SPLITS & NAVIGATION #####
unbind '"'
unbind %

bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3

bind c new-window -c "#{pane_current_path}"

##### COPY MODE (VI) #####
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

##### STATUS BAR (MINIMAL) #####
set -g status on
set -g status-interval 5

set -g status-style "bg=#282828,fg=#ebdbb2"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold] #I:#W "

set -g status-left "#S"
set -g status-right "%Y-%m-%d %H:%M"

##### ENV #####
set -g update-environment "PATH"
set -g default-command "zsh"

##### QUICK KEYS #####
bind r source-file ~/.tmux.conf \; display-message "reloaded"
bind Q kill-session

##### NESTED SESSIONS (SSH) #####
# Outer (local): prefix C-Space. Inner (over SSH): prefix C-a, so each
# level has its own key and you never double-prefix. Inner status bar
# turns blue as a visual cue. Manual fallback for local-only nesting
# (tmux inside tmux without SSH): run `:set -g prefix C-a` in the inner
# session. Caveat: if-shell sees the calling pane's env, so reloading
# this file from an ssh pane of the OUTER tmux flips the outer prefix
# too — reload from a local pane; the blue bar makes it visible.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g prefix C-a
  unbind C-Space
  bind C-a send-prefix
  set -g status-style "bg=#1d3b5e,fg=#ebdbb2"
  set -g status-left "#S [ssh]"
}

##### CLIPBOARD (LOCAL + OVER SSH) #####
# Forward tmux buffer copies to the terminal via OSC 52, and let inner
# tmux sessions pass theirs through the outer one. Over SSH this lands
# in the local macOS clipboard (Ghostty supports OSC 52). The Ms override
# guarantees the OSC 52 capability even when remote terminfo lacks it;
# allow-passthrough forwards app-side passthrough-wrapped sequences
# (nvim, opencode) to the outer terminal. No tools required on the
# remote end. Reload BOTH levels (prefix r in each) after changing this.
set -s set-clipboard on
set -g allow-passthrough on
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
# Local macOS: also pipe copies to pbcopy as a second path. Over SSH
# pbcopy is absent, so the plain y binding above + OSC 52 stays.
if-shell 'command -v pbcopy >/dev/null' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
}
